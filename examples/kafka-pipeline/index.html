const scene_isNode = typeof process !== 'undefined' &&
  Boolean(process.versions) && Boolean(process.versions.node);

let scene_fs = null;
if (scene_isNode) {
  try {
    scene_fs = await import('node:fs');
  } catch (error) {
    scene_fs = null;
  }
}

const scene_PORTS = ['top', 'bottom', 'north', 'south', 'east', 'west'];
const scene_PORT_SET = new Set(scene_PORTS);
const scene_TOKEN_SET = new Set([
  'ink', 'paper', 'steel', 'slate', 'amber', 'copper',
  'blue', 'green', 'brick', 'plum', 'sand', 'cloud'
]);
const scene_PART_KINDS = new Set(['box', 'plate', 'cylinder']);
const scene_DETAIL_SET = new Set(['rack', 'tray', 'tower', 'switch', 'tank', 'crate', 'pallet', 'coil', 'concrete', 'none']);
const scene_LINK_KINDS = new Set(['tube', 'cable']);
const scene_FLOW_KINDS = new Set(['request', 'job', 'packet']);
const scene_AXIS_SET = new Set(['x', 'y', 'z']);
const scene_MAX_SIZE = 4096;

function scene_isFiniteNumber(value) {
  return typeof value === 'number' && Number.isFinite(value);
}

function scene_isPositive(value) {
  return scene_isFiniteNumber(value) && value > 0;
}

function scene_isVec3(value) {
  return Array.isArray(value) && value.length === 3 && value.every(scene_isFiniteNumber);
}

function scene_isToken(value) {
  return typeof value === 'string' && scene_TOKEN_SET.has(value);
}

export function validateScene(input) {
  const errors = [];
  const at = (path, message) => errors.push(`${path}: ${message}`);

  if (input === null || typeof input !== 'object' || Array.isArray(input)) {
    return { ok: false, errors: ['$: scene must be an object'] };
  }

  if (input.version !== 1) at('version', 'required and must equal 1');
  if (typeof input.title !== 'string' || input.title.trim() === '') {
    at('title', 'required non-empty string');
  }
  if (input.theme !== 'light' && input.theme !== 'dark') {
    at('theme', 'must be "light" or "dark"');
  }
  if (input.subtitle !== undefined && typeof input.subtitle !== 'string') {
    at('subtitle', 'must be a string when present');
  }
  if (input.hint !== undefined && typeof input.hint !== 'string') {
    at('hint', 'must be a string when present');
  }

  if (input.size !== undefined) {
    const sizeOk = Array.isArray(input.size) && input.size.length === 2 &&
      input.size.every((n) => Number.isInteger(n) && n > 0 && n <= scene_MAX_SIZE);
    if (!sizeOk) {
      at('size', `must be [width, height] integers in 1..${scene_MAX_SIZE}`);
    }
  }

  const partIds = new Set();

  if (!Array.isArray(input.parts)) {
    at('parts', 'required array');
  } else {
    input.parts.forEach((part, index) => {
      const base = `parts[${index}]`;
      if (part === null || typeof part !== 'object' || Array.isArray(part)) {
        at(base, 'must be an object');
        return;
      }
      if (typeof part.id !== 'string' || part.id.trim() === '') {
        at(`${base}.id`, 'required non-empty string');
      } else if (partIds.has(part.id)) {
        at(`${base}.id`, `duplicate id "${part.id}"`);
      } else {
        partIds.add(part.id);
      }
      if (!scene_PART_KINDS.has(part.kind)) {
        at(`${base}.kind`, 'must be "box", "plate" or "cylinder"');
      }
      if (part.label !== undefined && typeof part.label !== 'string') {
        at(`${base}.label`, 'must be a string when present');
      }
      if (part.accent !== undefined && typeof part.accent !== 'boolean') {
        at(`${base}.accent`, 'must be a boolean when present');
      }
      if (!scene_isVec3(part.at)) {
        at(`${base}.at`, 'required [x, y, z] finite numbers');
      }
      if (!scene_isToken(part.color)) {
        at(`${base}.color`, 'must be a known color token');
      }
      if (part.kind === 'box' || part.kind === 'plate') {
        const sizeOk = Array.isArray(part.size) && part.size.length === 3 &&
          part.size.every(scene_isPositive);
        if (!sizeOk) at(`${base}.size`, 'required [w, d, h] positive numbers');
      }
      if (part.kind === 'cylinder') {
        if (!scene_isPositive(part.radius)) at(`${base}.radius`, 'required positive number');
        if (!scene_isPositive(part.h)) at(`${base}.h`, 'required positive number');
        if (!scene_AXIS_SET.has(part.axis)) at(`${base}.axis`, 'must be "x", "y" or "z"');
      }
      if (part.detail !== undefined && !scene_DETAIL_SET.has(part.detail)) {
        at(`${base}.detail`, 'must be "rack", "tray", "tower", "switch", "tank", "crate", "pallet", "coil", "concrete" or "none"');
      }
      for (const field of ['panels', 'hazard']) {
        if (part[field] !== undefined && typeof part[field] !== 'boolean') at(`${base}.${field}`, 'must be a boolean when present');
      }
      if (part.sublabel !== undefined && typeof part.sublabel !== 'string') at(`${base}.sublabel`, 'must be a string when present');
      if (part.vents !== undefined && typeof part.vents !== 'boolean') {
        at(`${base}.vents`, 'must be a boolean when present');
      }
      if (part.leds !== undefined && !(Number.isInteger(part.leds) && part.leds >= 0 && part.leds <= 6)) {
        at(`${base}.leds`, 'must be an integer in 0..6');
      }
    });
  }

  if (input.links !== undefined && !Array.isArray(input.links)) {
    at('links', 'must be an array when present');
  } else if (Array.isArray(input.links)) {
    input.links.forEach((link, index) => {
      const base = `links[${index}]`;
      if (link === null || typeof link !== 'object' || Array.isArray(link)) {
        at(base, 'must be an object');
        return;
      }
      if (typeof link.from !== 'string' || !partIds.has(link.from)) {
        at(`${base}.from`, 'must reference an existing part id');
      }
      if (typeof link.to !== 'string' || !partIds.has(link.to)) {
        at(`${base}.to`, 'must reference an existing part id');
      }
      if (link.fromPort !== undefined && !scene_PORT_SET.has(link.fromPort)) {
        at(`${base}.fromPort`, 'must be a known port name');
      }
      if (link.toPort !== undefined && !scene_PORT_SET.has(link.toPort)) {
        at(`${base}.toPort`, 'must be a known port name');
      }
      if (!scene_LINK_KINDS.has(link.kind)) {
        at(`${base}.kind`, 'must be "tube" or "cable"');
      }
      if (!scene_isToken(link.color)) {
        at(`${base}.color`, 'must be a known color token');
      }
      if (link.label !== undefined && typeof link.label !== 'string') {
        at(`${base}.label`, 'must be a string when present');
      }
    });
  }

  if (input.flows !== undefined && !Array.isArray(input.flows)) {
    at('flows', 'must be an array when present');
  } else if (Array.isArray(input.flows)) {
    input.flows.forEach((flow, index) => {
      const base = `flows[${index}]`;
      if (flow === null || typeof flow !== 'object' || Array.isArray(flow)) {
        at(base, 'must be an object');
        return;
      }
      if (!Array.isArray(flow.path) || flow.path.length < 2) {
        at(`${base}.path`, 'required array of at least two part ids');
      } else {
        flow.path.forEach((id, step) => {
          if (typeof id !== 'string' || !partIds.has(id)) {
            at(`${base}.path[${step}]`, 'must reference an existing part id');
          }
        });
      }
      if (!scene_FLOW_KINDS.has(flow.kind)) {
        at(`${base}.kind`, 'must be "request", "job" or "packet"');
      }
      if (!scene_isToken(flow.color)) {
        at(`${base}.color`, 'must be a known color token');
      }
      if (!scene_isFiniteNumber(flow.speed) || flow.speed < 6 || flow.speed > 24) {
        at(`${base}.speed`, 'required number of loops per minute in 6..24');
      }
      if (!Number.isInteger(flow.count) || flow.count < 2 || flow.count > 6) {
        at(`${base}.count`, 'required integer in 2..6');
      }
    });
  }

  if (input.readout !== undefined && !Array.isArray(input.readout)) {
    at('readout', 'must be an array when present');
  } else if (Array.isArray(input.readout)) {
    if (input.readout.length > 4) {
      at('readout', 'must contain at most 4 entries');
    }
    input.readout.forEach((entry, index) => {
      const base = `readout[${index}]`;
      if (entry === null || typeof entry !== 'object' || Array.isArray(entry)) {
        at(base, 'must be an object');
        return;
      }
      if (typeof entry.label !== 'string') at(`${base}.label`, 'required string');
      if (typeof entry.value !== 'string') at(`${base}.value`, 'required string');
    });
  }

  if (input.notes !== undefined && !Array.isArray(input.notes)) {
    at('notes', 'must be an array when present');
  } else if (Array.isArray(input.notes)) {
    input.notes.forEach((note, index) => {
      const base = `notes[${index}]`;
      if (note === null || typeof note !== 'object' || Array.isArray(note)) {
        at(base, 'must be an object');
        return;
      }
      if (typeof note.text !== 'string' || note.text.trim() === '') {
        at(`${base}.text`, 'required non-empty string');
      }
      if (typeof note.at !== 'string' || !partIds.has(note.at)) {
        at(`${base}.at`, 'must reference an existing part id');
      }
    });
  }

  return { ok: errors.length === 0, errors };
}

export function loadScene(path) {
  if (!scene_fs) throw new Error('loadScene requires a node runtime with node:fs available');
  let parsed;
  try {
    parsed = JSON.parse(scene_fs.readFileSync(path, 'utf8'));
  } catch (error) {
    throw new Error(`scene parse error for ${path}: ${error.message}`);
  }
  const result = validateScene(parsed);
  if (!result.ok) {
    throw new Error(`invalid scene ${path}:\n${result.errors.join('\n')}`);
  }
  return parsed;
}

function scene_samePoint(a, b) {
  return a[0] === b[0] && a[1] === b[1] && a[2] === b[2];
}

function scene_dist2(a, b) {
  const dx = a[0] - b[0];
  const dy = a[1] - b[1];
  const dz = a[2] - b[2];
  return dx * dx + dy * dy + dz * dz;
}

function scene_dist(a, b) {
  return Math.sqrt(scene_dist2(a, b));
}

function scene_centerOf(ports) {
  let cx = 0;
  let cy = 0;
  let cz = 0;
  let count = 0;
  for (const name of scene_PORTS) {
    const point = ports[name];
    if (!point) continue;
    cx += point[0];
    cy += point[1];
    cz += point[2];
    count += 1;
  }
  if (count === 0) return [0, 0, 0];
  return [cx / count, cy / count, cz / count];
}

function scene_nearestPort(ports, target) {
  let best = scene_PORTS[0];
  let bestDistance = Infinity;
  for (const name of scene_PORTS) {
    const point = ports[name];
    if (!point) continue;
    const distance = scene_dist2(point, target);
    if (distance < bestDistance - 1e-12) {
      bestDistance = distance;
      best = name;
    }
  }
  return best;
}

export function resolveLinks(scene) {
  const byId = new Map((scene.parts || []).map((part) => [part.id, part]));
  const links = Array.isArray(scene.links) ? scene.links : [];
  const resolved = [];
  for (const link of links) {
    const fromPart = byId.get(link.from);
    const toPart = byId.get(link.to);
    if (!fromPart || !toPart) continue;
    const fromPorts = anchors(fromPart);
    const toPorts = anchors(toPart);
    const fromCenter = scene_centerOf(fromPorts);
    const toCenter = scene_centerOf(toPorts);
    const fromPort = link.fromPort && fromPorts[link.fromPort]
      ? link.fromPort
      : scene_nearestPort(fromPorts, toCenter);
    const toPort = link.toPort && toPorts[link.toPort]
      ? link.toPort
      : scene_nearestPort(toPorts, fromCenter);
    const pointA = fromPorts[fromPort].slice();
    const pointB = toPorts[toPort].slice();
    const kind = link.kind === 'cable' ? 'cable' : 'tube';
    resolved.push({
      from: link.from,
      to: link.to,
      fromPort,
      toPort,
      kind,
      points: linkPoints([pointA, pointB], kind)
    });
  }
  return resolved;
}

function scene_directEdge(byId, fromId, toId) {
  const fromPorts = anchors(byId.get(fromId));
  const toPorts = anchors(byId.get(toId));
  const fromCenter = scene_centerOf(fromPorts);
  const toCenter = scene_centerOf(toPorts);
  const fromPort = scene_nearestPort(fromPorts, toCenter);
  const toPort = scene_nearestPort(toPorts, fromCenter);
  return {
    from: fromId,
    to: toId,
    fromPort,
    toPort,
    points: [fromPorts[fromPort].slice(), toPorts[toPort].slice()]
  };
}

function scene_orientEdge(edge, fromId) {
  if (edge.from === fromId) return edge;
  return {
    from: edge.to,
    to: edge.from,
    fromPort: edge.toPort,
    toPort: edge.fromPort,
    points: edge.points.slice().reverse()

}

export function resolveFlows(scene) {
  const byId = new Map((scene.parts || []).map((part) => [part.id, part]));
  const links = resolveLinks(scene);
  const flows = Array.isArray(scene.flows) ? scene.flows : [];
  return flows.map((flow) => {
    const edges = [];
    const path = Array.isArray(flow.path) ? flow.path : [];
    for (let step = 0; step < path.length - 1; step += 1) {
      const fromId = path[step];
      const toId = path[step + 1];
      const link = links.find((candidate) => (
        (candidate.from === fromId && candidate.to === toId) ||
        (candidate.from === toId && candidate.to === fromId)
      ));
      if (link) {
        edges.push(scene_orientEdge(link, fromId));
      } else if (byId.has(fromId) && byId.has(toId)) {
        edges.push(scene_directEdge(byId, fromId, toId));
      }
    }
    return { flow, edges };
  });

function scene_polyline(edges) {
  const points = [];
  for (const edge of edges || []) {
    for (const point of edge.points || []) {
      const last = points[points.length - 1];
      if (last && scene_samePoint(last, point)) continue;
      points.push(point);
    }
  }
  return points;
}

export function sampleFlowPoint(edges, u) {
  const polyline = scene_polyline(edges);
  if (polyline.length === 0) return [0, 0, 0];
  if (polyline.length === 1) return polyline[0].slice();
  const segments = [];
  let total = 0;
  for (let index = 0; index < polyline.length - 1; index += 1) {
    const a = polyline[index];
    const b = polyline[index + 1];
    const length = scene_dist(a, b);
    segments.push({ a, b, length });
    total += length;
  }
  if (total === 0) return polyline[0].slice();
  const wrapped = ((u % 1) + 1) % 1;
  let remaining = wrapped * total;
  for (let index = 0; index < segments.length; index += 1) {
    const segment = segments[index];
    if (remaining <= segment.length || index === segments.length - 1) {
      const fraction = segment.length === 0
        ? 0
        : Math.max(0, Math.min(1, remaining / segment.length));
      return [
        segment.a[0] + (segment.b[0] - segment.a[0]) * fraction,
        segment.a[1] + (segment.b[1] - segment.a[1]) * fraction,
        segment.a[2] + (segment.b[2] - segment.a[2]) * fraction
      ];
    }
    remaining -= segment.length;
  }
  return polyline[polyline.length - 1].slice();
}

export function sampleFlowPose(edges, u) {
  const pos = sampleFlowPoint(edges, u);
  const ahead = sampleFlowPoint(edges, u + 0.001);
  let dx = ahead[0] - pos[0];
  let dy = ahead[1] - pos[1];
  let dz = ahead[2] - pos[2];
  let length = Math.hypot(dx, dy, dz);
  if (length < 1e-9) {
    const behind = sampleFlowPoint(edges, u - 0.001);
    dx = pos[0] - behind[0];
    dy = pos[1] - behind[1];
    dz = pos[2] - behind[2];
    length = Math.hypot(dx, dy, dz);
  }
  const dir = length < 1e-9 ? [1, 0, 0] : [dx / length, dy / length, dz / length];
  return { pos, dir };
}


const motion_NS = 'http://www.w3.org/2000/svg';

const motion_TRAIL_SPAN = 0.19;
const motion_TRAIL_LEAD = 0.042;
const motion_TRAIL_WIDTH = 0.11;
const motion_TRAIL_OPACITY = 0.55;
const motion_LIGHT_GLOW = 0.07;
const motion_WAVE_CYCLES = 3;
const motion_SPARK_OFFSET = 0.075;
const motion_PARALLAX_LERP = 0.07;
const motion_PARALLAX_X = 6;
const motion_PARALLAX_Y = 4;

function motion_round(value) {
  return Math.round(value * 1000) / 1000;
}

function motion_prefersReduced() {
  if (typeof matchMedia !== 'function') return false;

    return matchMedia('(prefers-reduced-motion: reduce)').matches === true;
  } catch (error) {

function motion_seekTime() {
  if (typeof location === 'undefined' || !location || typeof location.search !== 'string') {
    return null;
  }
  const params = new URLSearchParams(location.search);
  if (!params.has('t')) return null;
  const raw = params.get('t');
  if (raw === null || raw === 'live' || raw.trim() === '') return null;
  const value = Number(raw);
  return Number.isFinite(value) ? value : null;
}

  const raw = typeof world.getAttribute === 'function'
    ? world.getAttribute('data-scene')
    : world.dataset && world.dataset.scene;
  if (!raw) throw new Error('mount: .world is missing data-scene');
  return JSON.parse(raw);

function motion_query(search, name) {
  if (typeof search !== 'string') return null;
  const params = new URLSearchParams(search);
  if (!params.has(name)) return null;
  return params.get(name);
}

function motion_frameMode() {
  if (typeof location === 'undefined' || !location) return false;
  const raw = motion_query(location.search, 'frame');
  return raw !== null && raw !== '0' && raw !== 'false';

  const body = doc && doc.body;

  wrap.setAttribute('class', 'parallax');
  wrap.setAttribute('transform', 'translate(0,0)');

  state.step = () => {
    state.cx += (state.tx - state.cx) * motion_PARALLAX_LERP;
    state.cy += (state.ty - state.cy) * motion_PARALLAX_LERP;
    wrap.setAttribute('transform', 'translate(' + motion_round(state.cx) + ',' + motion_round(state.cy) + ')');
  };
  state.stop = () => {
    if (typeof window !== 'undefined' && typeof window.removeEventListener === 'function') {
      window.removeEventListener('mousemove', onMove);
    }
  };
  return state;
}

function motion_packetGroup(svg) {
  const existing = svg.querySelector('g.packets');
  if (existing) return existing;
  const group = document.createElementNS(motion_NS, 'g');
  group.setAttribute('class', 'packets');
  const fit = svg.querySelector('g[transform]');
  (fit || svg).appendChild(group);
  return group;
}

function motion_flowToken(flow) {
  return flow && typeof flow.color === 'string' && TOKENS.light[flow.color] ? flow.color : 'green';
}

function motion_trailGradientId(token) {
  return 'diorama-trail-' + token;
}

function motion_glowAlpha(theme) {
  return motion_round(theme === 'dark' ? motion_TRAIL_OPACITY : motion_TRAIL_OPACITY + motion_LIGHT_GLOW);
}

function motion_seedTrailGradient(defs, token, theme) {
  const id = motion_trailGradientId(token);
  if (defs.querySelector && defs.querySelector('radialGradient[id="' + id + '"]')) return;
  const gradient = document.createElementNS(motion_NS, 'radialGradient');
  gradient.setAttribute('id', id);
  for (const [offset, opacity] of [[0, motion_glowAlpha(theme)], [1, 0]]) {
    const stop = document.createElementNS(motion_NS, 'stop');
    stop.setAttribute('offset', String(offset));
    stop.setAttribute('stop-color', TOKENS[theme][token].left);
    stop.setAttribute('stop-opacity', String(opacity));
    gradient.appendChild(stop);
  }
  defs.appendChild(gradient);
}

function motion_defs(svg) {
  const existing = svg.querySelector('defs');
  if (existing) return existing;
  const defs = document.createElementNS(motion_NS, 'defs');
  if (typeof svg.insertBefore === 'function' && svg.firstChild) svg.insertBefore(defs, svg.firstChild);
  else svg.appendChild(defs);
  return defs;
}

function motion_makeTrail(flowIndex, color) {
  const trail = document.createElementNS(motion_NS, 'g');
  trail.setAttribute('class', 'packet-trail');
  trail.setAttribute('data-flow', String(flowIndex));
  for (let i = 0; i < 7; i += 1) {
    const piece = document.createElementNS(motion_NS, 'polyline');
    piece.setAttribute('class', 'packet-hot');
    piece.setAttribute('fill', 'none');
    piece.setAttribute('stroke', color);
    piece.setAttribute('stroke-width', String(motion_round(motion_TRAIL_WIDTH * (1 - i / 9))));
    piece.setAttribute('stroke-opacity', String(motion_round(motion_HOT[i])));
    piece.setAttribute('stroke-linecap', 'round');
    trail.appendChild(piece);
  }
  return trail;
}

const motion_HOT = [1, 0.86, 0.69, 0.52, 0.36, 0.22, 0.1];

function motion_mix(color, target, amount) {
  return '#' + [1, 3, 5].map((offset) => Math.round(parseInt(color.slice(offset, offset + 2), 16) * (1 - amount) + target * amount).toString(16).padStart(2, '0')).join('');
}

function motion_bright(color) {
  return motion_mix(color, 255, 0.82);
}

function motion_core(color) {
  return motion_mix(color, 255, 0.93);
}

function motion_rim(color) {
  return motion_mix(color, 0, 0.42);
}

function motion_makePacket(flowIndex, ring) {
  const packet = document.createElementNS(motion_NS, 'circle');
  packet.setAttribute('class', 'packet');
  packet.setAttribute('data-flow', String(flowIndex));
  packet.setAttribute('r', '0.215');
  packet.setAttribute('fill', motion_core(ring));
  packet.setAttribute('stroke', motion_rim(ring));
  packet.setAttribute('stroke-width', '1');
  packet.setAttribute('vector-effect', 'non-scaling-stroke');
  return packet;
}

export function seedPackets(svg, scene) {
  const group = motion_packetGroup(svg);
  if (motion_prefersReduced()) return group;
  if (group.querySelector('circle.packet')) return group;
  const theme = scene.theme === 'dark' ? 'dark' : 'light';
  const flows = Array.isArray(scene.flows) ? scene.flows : [];
  const defs = motion_defs(svg);
  flows.forEach((flow, index) => {
    const count = Number.isInteger(flow.count) && flow.count > 0 ? flow.count : 0;
    const token = motion_flowToken(flow);
    const color = TOKENS[theme][token].left;
    if (count > 0) motion_seedTrailGradient(defs, token, theme);
    for (let slot = 0; slot < count; slot += 1) {
      const packet = motion_makePacket(index, color);
      const aura = document.createElementNS(motion_NS, 'circle');
      aura.setAttribute('class', 'packet-aura');
      aura.setAttribute('data-flow', String(index));
      aura.setAttribute('r', '0.56');
      aura.setAttribute('fill', 'url(#' + motion_trailGradientId(token) + ')');
      packet.motion_aura = aura;
      packet.motion_sparks = [];
      group.appendChild(motion_makeTrail(index, color));
      group.appendChild(aura);
      group.appendChild(packet);
      for (let sparkIndex = 0; sparkIndex < 3; sparkIndex += 1) {
        const spark = document.createElementNS(motion_NS, 'circle');
        spark.setAttribute('class', 'packet-spark');
        spark.setAttribute('data-flow', String(index));
        spark.setAttribute('fill', motion_bright(color));
        spark.setAttribute('r', String(0.06 + sparkIndex * 0.02));
        packet.motion_sparks.push(spark);
        group.appendChild(spark);
      }
    }
  });
  return group;
}

function motion_hash(flow, slot, frame, spark) {
  let n = Math.imul(flow + 1, 374761393) ^ Math.imul(slot + 1, 668265263) ^ Math.imul(frame, 1274126177) ^ Math.imul(spark + 1, 1597334677);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return (n ^ (n >>> 16)) >>> 0;
}

function motion_pathStops(edges) {
  const stops = [];
  let total = 0;
  let previous = null;
  for (const edge of edges) for (const point of edge.points) {
    if (previous) total += Math.hypot(...point.map((v, i) => v - previous[i]));
    stops.push({ point, distance: total });
    previous = point;
  }
  return stops.map((stop) => ({ point: stop.point, u: total ? stop.distance / total : 0 }));
}

function motion_flowTouches(scene) {
  const flows = Array.isArray(scene.flows) ? scene.flows : [];
  return flows.map((flow) => new Set(Array.isArray(flow.path) ? flow.path : []));
}

function motion_clearActive(svg) {
  svg.querySelectorAll('.part.active, .link.active, .packet.active').forEach((element) => {
    element.classList.remove('active');
  });
}

function motion_applyHighlight(svg, flowTouches, id) {
  motion_clearActive(svg);
  if (id === null || id === undefined) return;
  const part = svg.querySelector(`.part[data-id="${id}"]`);
  if (part) part.classList.add('active');
  svg.querySelectorAll('.link').forEach((link) => {
    const from = link.getAttribute('data-from');
    const to = link.getAttribute('data-to');
    if (from === id || to === id) link.classList.add('active');
  });
  svg.querySelectorAll('.packet').forEach((packet) => {
    const flowIndex = Number(packet.getAttribute('data-flow'));
    const touches = flowTouches[flowIndex];
    if (touches && touches.has(id)) packet.classList.add('active');
  });
}

function motion_wireInteraction(svg, scene) {
  const flowTouches = motion_flowTouches(scene);
  let pinned = null;
  svg.querySelectorAll('.part').forEach((part) => {
    const id = part.getAttribute('data-id');
    if (!id) return;
    part.addEventListener('mouseenter', () => {
      if (pinned === null) motion_applyHighlight(svg, flowTouches, id);
    });
    part.addEventListener('mouseleave', () => {
      if (pinned === null) motion_applyHighlight(svg, flowTouches, null);
    });
    part.addEventListener('click', () => {
      if (pinned === id) {
        pinned = null;
        motion_applyHighlight(svg, flowTouches, null);
      } else {
        pinned = id;
        motion_applyHighlight(svg, flowTouches, id);
      }
    });
  });
}

function motion_startLoop(state, parallax) {
  if (!motion_RAF) return;
  let start = null;
  const frame = (timestamp) => {
    if (start === null) start = timestamp;
    tick(state.scene, state.svg, (timestamp - start) / 1000);
    if (parallax) parallax.step();
    state.frame = motion_RAF(frame);
  };
  state.frame = motion_RAF(frame);
}

export function tick(scene, svgElement, timeSeconds) {
  if (!svgElement || typeof svgElement.querySelectorAll !== 'function') return;
  const packets = svgElement.querySelectorAll('circle.packet');
  if (!packets || packets.length === 0) return;
  const trails = typeof svgElement.querySelectorAll === 'function'
    ? svgElement.querySelectorAll('g.packet-trail')
    : [];
  const groups = resolveFlows(scene);
  const glow = scene && scene.theme === 'dark' ? 1 : 1 + motion_LIGHT_GLOW;
  const byFlow = new Map();
  packets.forEach((packet) => {
    const flowIndex = Number(packet.getAttribute('data-flow'));
    if (!byFlow.has(flowIndex)) byFlow.set(flowIndex, []);
    byFlow.get(flowIndex).push(packet);
  });
  const trailsByFlow = new Map();
  Array.prototype.forEach.call(trails || [], (trail) => {
    const flowIndex = Number(trail.getAttribute('data-flow'));
    if (!trailsByFlow.has(flowIndex)) trailsByFlow.set(flowIndex, []);
    trailsByFlow.get(flowIndex).push(trail);
  });
  byFlow.forEach((list, flowIndex) => {
    const entry = groups[flowIndex];
    if (!entry || !entry.edges || entry.edges.length === 0) return;
    const speed = Number.isFinite(entry.flow.speed) ? entry.flow.speed : 6;
    const loopsPerSecond = speed / 60;
    const flowTrails = trailsByFlow.get(flowIndex) || [];
    const stops = motion_pathStops(entry.edges);
    list.forEach((packet, slot) => {
      const u = (((timeSeconds * loopsPerSecond + slot / list.length) % 1) + 1) % 1;
      const world = sampleFlowPoint(entry.edges, u);
      const [sx, sy] = project(world[0], world[1], world[2]);
      packet.setAttribute('cx', String(motion_round(sx)));
      packet.setAttribute('cy', String(motion_round(sy)));
      if (packet.motion_aura) {
        packet.motion_aura.setAttribute('cx', String(motion_round(sx)));
        packet.motion_aura.setAttribute('cy', String(motion_round(sy)));
      }
      const ahead = sampleFlowPoint(entry.edges, Math.min(1, u + 0.01));
      const [ax, ay] = project(ahead[0], ahead[1], ahead[2]);
      const run = Math.hypot(ax - sx, ay - sy) || 1;
      const nx = -(ay - sy) / run;
      const ny = (ax - sx) / run;
      (packet.motion_sparks || []).forEach((spark, index) => {
        const hash = motion_hash(flowIndex, slot, Math.floor(timeSeconds * 12), index);
        const side = hash % 2 ? 1 : -1;
        const off = motion_SPARK_OFFSET * (1 + ((hash >>> 4) % 1000) / 999);
        const along = (((hash >>> 14) % 1000) / 999 - 0.5) * 0.34;
        spark.setAttribute('cx', String(motion_round(sx + nx * off * side + (ax - sx) / run * along)));
        spark.setAttribute('cy', String(motion_round(sy + ny * off * side + (ay - sy) / run * along)));
        spark.setAttribute('opacity', String(motion_round(0.2 + ((hash >>> 20) % 351) / 1000)));
      });
      const trail = flowTrails[slot];
      if (!trail) return;
      Array.from(trail.children).forEach((piece, index) => {
        const head = Math.min(1, Math.max(0, u + motion_TRAIL_LEAD - motion_TRAIL_SPAN * index / 7));
        const tail = Math.min(1, Math.max(0, u + motion_TRAIL_LEAD - motion_TRAIL_SPAN * (index + 1) / 7));
        const points = [sampleFlowPoint(entry.edges, tail), ...stops.filter((stop) => stop.u > tail && stop.u < head).map((stop) => stop.point), sampleFlowPoint(entry.edges, head)];
        piece.setAttribute('points', points.map((point) => project(...point).map(motion_round).join(',')).join(' '));
        const wave = 0.84 + 0.16 * Math.cos((u * motion_WAVE_CYCLES - index / 7) * Math.PI * 2);
        piece.setAttribute('stroke-opacity', String(motion_round(Math.min(1, motion_HOT[index] * wave * glow))));
      });
    });
  });
}

export function mount(root = document) {
  try {
    if (!root || typeof root.querySelector !== 'function') {
      throw new Error('mount: invalid root');
    }
    applyFrameMode(root);
    const world = root.querySelector('.world');
    if (!world) throw new Error('mount: .world not found');
    const scene = motion_parseScene(world);
    const stage = world.querySelector('.stage');
    if (!stage) throw new Error('mount: .stage not found');
    let svg = stage.querySelector('svg');
    if (!svg) {
      stage.innerHTML = renderSVG(scene);
      svg = stage.querySelector('svg');
    }
    if (!svg) throw new Error('mount: svg unavailable');
    seedPackets(svg, scene);
    motion_wireInteraction(svg, scene);
    const state = {
      scene,
      svg,
      frame: 0,
      parallax: null,
      stop() {
        if (motion_RAF && state.frame) cancelAnimationFrame(state.frame);
        state.frame = 0;
        if (state.parallax) state.parallax.stop();
      }
    };
    const seek = motion_seekTime();
    if (seek !== null) {
      tick(scene, svg, seek);
      return state;
    }
    state.parallax = seedParallax(svg, seek);
    motion_startLoop(state, state.parallax);
    return state;
  } catch (error) {
    console.error('diorama motion: mount failed:', error && error.message ? error.message : error);
    return null;
  }
}

mount();

</script>
</body>
</html>
