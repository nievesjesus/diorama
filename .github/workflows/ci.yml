name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: node --test

      - name: Build examples
        run: |
          if ls examples/*/scene.json >/dev/null 2>&1; then
            node scripts/build-examples.mjs
          else
            echo "No examples yet; skipping build."
          fi

      - name: Verify committed builds
        run: |
          if ls examples/*/scene.json >/dev/null 2>&1; then
            git diff --exit-code
          else
            echo "No examples yet; skipping diff check."
          fi

      - name: Audit examples
        run: |
          if ls examples/*/scene.json >/dev/null 2>&1; then
            for scene in examples/*/scene.json; do
              node build.mjs "$scene" --audit
            done
          else
            echo "No examples yet; skipping audit."
          fi
